services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-acf}
    ports:
      # Local tools only; never expose the database beyond this machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acf} -d ${POSTGRES_DB:-acf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      PROMPTS_DIR: /app/prompts
      ARTICLES_OUTPUT_DIR: /app/output/articles
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./prompts:/app/prompts
      - ./n8n:/app/n8n
      - ./topics:/app/topics
      - ./scripts:/app/scripts
      - ./output:/app/output
      - ./pyproject.toml:/app/pyproject.toml
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Thin HTTP client for Stage 1 — no OpenAI keys, no DB credentials.
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      # n8n has no auth in Stage 1 — keep the UI on the loopback interface.
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Moscow}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
